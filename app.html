["start","Getting started",`<p><b>Vantage ESS</b> is your personal employee self-service workspace: profile, team, calendar, leave, time, attendance, delegations, files and cases in one place.</p><ol><li>Open <b>Profile</b> and click <i>Set up profile</i>.</li><li>Go to <b>Leave</b> and add your leave types (for example Annual – 20 days).</li><li>Add teammates in <b>Team</b> and meetings in <b>Calendar</b>.</li><li>Press <b>Check-in</b> in the header when your day starts.</li><li>Open <b>Personal Settings</b> to make the workspace yours.</li></ol><div class="tip">Nothing is pre-filled. Every record you see is one you created, and it stays on this device.</div>`],
["nav","Navigating the portal",`<ul><li><b>Sidebar</b> (desktop): all modules, plus Personal Settings, Updates and User Manual at the bottom.</li><li><b>Bottom tab bar</b> (phones and narrow windows): Home, Calendar, Leave, Attendance and <i>More</i>, which opens the full menu.</li><li><b>Top bar</b>: current page, quick Check-in/Check-out, Apply leave and a light/dark switch. Your profile card sits at the bottom of the sidebar.</li></ul><p><b>Keyboard shortcuts</b></p><ul><li><kbd>Alt</kbd>+<kbd>1</kbd>…<kbd>9</kbd> open Profile, Team, Calendar, Leave, Timesheet, Attendance, Delegation, Files, Cases.</li><li><kbd>Alt</kbd>+<kbd>H</kbd> opens this manual. <kbd>Esc</kbd> closes any dialog.</li></ul>`],

["team","Team",`<p>Add each teammate with name (required), designation, email and status. Click a card to edit or delete it. The ✉ icon opens your mail app. Status (Online, Away, Offline) is set by you.</p>`],

["time","Timesheet",`<ul><li><b>Timer</b>: Start, work, then <i>Stop &amp; log</i>. The form opens with the hours filled in. The timer keeps running even if you close the app.</li><li><b>Manual log</b>: add date, project, job, hours and billable status.</li><li><b>Filter</b>: All, Today, This week, Billable.</li></ul>`],

["dele","Delegation",`<p>Record who approves on your behalf. Choose <b>Temporary</b> (with dates) or <b>Permanent</b>. <i>Delegator and Delegatee</i> means both get approval messages; <i>Delegatee</i> only means just the delegatee. This is a personal record and does not send messages.</p>`],
["files","Files",`<p><i>Upload</i> records the file name, date and source “Personal upload”. You can also add records such as “Shared with me”. In this version the file contents are not stored, only the record.</p>`],
["cases","Cases",`<p>Raise a case with subject, category (HR, IT, Payroll, Admin, Other) and description. Update the status as it moves: Open → In Progress → Resolved → Closed.</p>`],

["data","Data, backup &amp; privacy",`<ul><li>Everything is saved in this browser or desktop app. Nothing is sent to a server.</li><li><b>Export JSON</b> saves a full backup, including your update history. <b>Import</b> restores it. <b>Reset</b> erases everything and asks for a second click.</li><li>Clearing browser data erases your records. Export a backup regularly.</li></ul><div class="tip">To move to another computer: Export on the old one, Import on the new one.</div>`],
